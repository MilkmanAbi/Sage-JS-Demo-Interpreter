[package]
name        = "sage-requests"
version     = "0.1.0"
description = "HTTP client for Sage via libcurl C FFI"
authors     = ["MilkmanAbi"]
license     = "MIT"
repository  = "https://github.com/MilkmanAbi/Sage-Playground"
keywords    = ["http", "curl", "ffi", "c", "networking", "rest"]
category    = "networking"

[dependencies]
sage-io   = "1.2.0"
sage-json = "0.9.0"

[ffi]
c = true
libs = ["curl"]
pkg_config = "libcurl"

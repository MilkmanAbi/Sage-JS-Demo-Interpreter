[package]
name        = "sage-redis"
version     = "0.1.0"
description = "Redis client for Sage via hiredis C FFI"
authors     = ["MilkmanAbi"]
license     = "MIT"
repository  = "https://github.com/MilkmanAbi/Sage-Playground"
keywords    = ["redis", "cache", "hiredis", "ffi", "c", "pubsub"]
category    = "database"

[dependencies]
sage-io   = "1.2.0"
sage-json = "0.9.0"

[ffi]
c = true
libs = ["hiredis"]
pkg_config = "hiredis"

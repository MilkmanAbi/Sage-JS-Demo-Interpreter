[package]
name        = "sage-pandas"
version     = "0.1.0"
description = "pandas DataFrame bindings for Sage via Python FFI"
authors     = ["MilkmanAbi"]
license     = "MIT"
repository  = "https://github.com/MilkmanAbi/Sage-Playground"
keywords    = ["pandas", "dataframe", "csv", "analytics", "ffi", "python"]
category    = "science"

[dependencies]
sage-io   = "1.2.0"
sage-json = "0.9.0"

[ffi]
python = true
requires = ["pandas >= 2.0", "numpy >= 1.24"]
